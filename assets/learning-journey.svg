  <rect x="50" y="382" width="500" height="285" rx="20" fill="#B9A4D5"/>
  <circle cx="485" cy="440" r="34" fill="none" stroke="#F2E8D8" stroke-width="2" opacity=".9"/>
  <circle cx="485" cy="440" r="20" fill="none" stroke="#E9D99B" stroke-width="2"/>
  <circle cx="485" cy="440" r="5" fill="#F2E8D8"/>
  <circle cx="453" cy="462" r="4" fill="#E9D99B"/>
  <text x="82" y="438" fill="#665477" font-family="Georgia,serif" font-size="51">03</text>
  <text x="82" y="478" fill="#49364F" font-family="Arial" font-size="14" letter-spacing="2">ARTIFICIAL INTELLIGENCE</text>
  <text x="82" y="535" fill="#30263D" font-family="Georgia,serif" font-size="33">Inteligência Artificial.</text>
  <text x="82" y="579" fill="#49364F" font-family="Arial" font-size="20">Sistemas inteligentes e soluções</text>
  <text x="82" y="608" fill="#49364F" font-family="Arial" font-size="20">baseadas em IA.</text>
  <text x="82" y="644" fill="#665477" font-family="Arial" font-size="16">AI  /  Intelligent Agents</text>

