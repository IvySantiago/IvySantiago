  <path d="M50 34 H1150" stroke="#F2E8D8" opacity=".35"/>
  <text x="52" y="61" fill="#F2E8D8" font-family="Arial" font-size="15" letter-spacing="4">01 — ÁREAS QUE ESTOU EXPLORANDO</text>
  <circle cx="1089" cy="48" r="5" fill="#D9A8BE"/>
  <circle cx="1107" cy="48" r="5" fill="#B9A4D5"/>
  <circle cx="1125" cy="48" r="5" fill="#E9D99B"/>

  <!-- 01 AUTOMATION -->
  <rect x="50" y="88" width="700" height="270" rx="20" fill="url(#automation)"/>
  <rect x="50" y="88" width="700" height="270" rx="20" fill="url(#dots)"/>
  <rect x="50" y="88" width="7" height="270" rx="3" fill="#D9A8BE"/>

  <text x="82" y="145" fill="#F2C5D9" font-family="Georgia,serif" font-size="51">01</text>
