  <rect x="775" y="88" width="375" height="270" rx="20" fill="#D9A8BE"/>
  <path d="M1090 88 H1150 V148" fill="none" stroke="#FFF0E2" stroke-width="2" opacity=".8"/>
  <circle cx="1119" cy="119" r="5" fill="#E9D99B"/>
  <text x="805" y="145" fill="#754C75" font-family="Georgia,serif" font-size="51">02</text>
  <text x="805" y="180" fill="#49364F" font-family="Arial" font-size="14" letter-spacing="2">PROGRAMMING</text>
  <text x="805" y="230" fill="#30263D" font-family="Georgia,serif" font-size="34">Programação.</text>
  <text x="805" y="270" fill="#49364F" font-family="Arial" font-size="19">Raciocínio lógico e</text>
  <text x="805" y="298" fill="#49364F" font-family="Arial" font-size="19">fundamentos da programação.</text>
  <text x="805" y="333" fill="#49364F" font-family="Arial" font-size="16">Python  /  Logic</text>
  <circle cx="1120" cy="325" r="5" fill="#E9D99B"/>

