  <rect x="575" y="382" width="575" height="285" rx="20" fill="#A9C5B8"/>
  <path d="M1090 382 H1150 V442" fill="none" stroke="#F2E8D8" stroke-width="2" opacity=".9"/>
  <circle cx="1120" cy="412" r="5" fill="#E9D99B"/>
  <text x="608" y="438" fill="#557365" font-family="Georgia,serif" font-size="51">04</text>
  <text x="1117" y="422" text-anchor="end" fill="#49364F" font-family="Arial" font-size="14" letter-spacing="2">INFRASTRUCTURE</text>
  <text x="608" y="515" fill="#30263D" font-family="Georgia,serif" font-size="39">Infraestrutura.</text>
  <text x="608" y="566" fill="#49364F" font-family="Arial" font-size="20">Conhecimento dos ambientes que sustentam</text>
  <text x="608" y="596" fill="#49364F" font-family="Arial" font-size="20">aplicações e automações.</text>
  <text x="608" y="644" fill="#557365" font-family="Arial" font-size="17">Linux  /  Docker  /  Servers</text>
  <circle cx="1115" cy="640" r="5" fill="#E9D99B"/>

  <!-- Footer accents only -->
  <path d="M50 692 H1150" stroke="#F2E8D8" opacity=".3"/>
  <circle cx="1095" cy="692" r="4" fill="#D9A8BE"/>
  <circle cx="1115" cy="692" r="4" fill="#B9A4D5"/>
  <circle cx="1135" cy="692" r="4" fill="#E9D99B"/>
