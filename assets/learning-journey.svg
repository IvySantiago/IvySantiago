  <text x="82" y="218" fill="#FFF3E7" font-family="Georgia,serif" font-size="45">Fluxos de Automação.</text>
  <text x="84" y="264" fill="#F2E8D8" font-family="Arial" font-size="22">Criação de fluxos automatizados e integração</text>
  <text x="84" y="294" fill="#F2E8D8" font-family="Arial" font-size="22">entre diferentes serviços.</text>
  <text x="84" y="333" fill="#F2C5D9" font-family="Arial" font-size="18" letter-spacing="1">n8n  /  APIs  /  Webhooks</text>

  <circle cx="674" cy="270" r="40" fill="none" stroke="#F2E8D8" stroke-width="1.5" opacity=".65"/>
  <circle cx="674" cy="270" r="23" fill="none" stroke="#E9D99B" stroke-width="2" opacity=".9"/>
  <circle cx="674" cy="230" r="6" fill="#E9D99B"/>
  <circle cx="713" cy="281" r="5" fill="#D9A8BE"/>
  <path d="M635 270 H651" stroke="#F2E8D8" stroke-width="2" opacity=".7"/>

