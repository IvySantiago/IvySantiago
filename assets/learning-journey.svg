
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241D30"/>
      <stop offset="100%" stop-color="#30263D"/>
    </linearGradient>
    <linearGradient id="automation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62476A"/>
      <stop offset="100%" stop-color="#49364F"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#F2E8D8" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>

